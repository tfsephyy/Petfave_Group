name: petfave

services:
  backend:
    image: petfave-backend:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8089}:80"
    environment:
      APP_NAME: PetFave
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in the root .env file}
      APP_URL: http://localhost:${APP_PORT:-8088}
      FRONTEND_URL: http://localhost:${APP_PORT:-8088}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-petfave_clinic_lab}
      DB_USERNAME: ${DB_USERNAME:-petfave_lab}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_COOKIE: petfave_clinic_lab_session
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: clinic@example.test
      MAIL_FROM_NAME: PetFave
    volumes:
      - clinic_storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    image: petfave-frontend:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-petfave_clinic_lab}
      MYSQL_USER: ${DB_USERNAME:-petfave_lab}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env file}
    volumes:
      - clinic_database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      start_period: 40s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8090}:80"
    environment:
      PMA_HOST: database
      PMA_PORT: "3306"
      PMA_USER: ${DB_USERNAME:-petfave_lab}
      PMA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      UPLOAD_LIMIT: 64M
      HIDE_PHP_VERSION: "true"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  clinic_database:
  clinic_storage:
